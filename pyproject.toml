[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermocline"
version = "1.1.0"
description = "Carnet de plongée local pour les ordinateurs Mares — local dive logbook for Mares dive computers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-2.1-or-later" }
authors = [{ name = "Pataclop" }]
keywords = ["scuba", "diving", "logbook", "mares", "dive computer", "plongée"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/Pataclop/thermocline"
Source = "https://github.com/Pataclop/thermocline"
Issues = "https://github.com/Pataclop/thermocline/issues"

[project.scripts]
thermocline = "thermocline.cli:main"

[project.gui-scripts]
thermocline-gui = "thermocline.app:run_gui"

[tool.setuptools.packages.find]
include = ["thermocline*"]

[tool.setuptools.package-data]
thermocline = ["resources/*"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    # La longueur des lignes est tenue à la main; couper une phrase de
    # commentaire au caractère près nuit plus qu'elle n'aide.
    "E501",
    # `zip()` sans `strict=`: plusieurs parcours comparent volontairement une
    # suite avec elle-même décalée d'un cran (`zip(xs, xs[1:])`).
    "B905",
    # `contextlib.suppress` rend le code plus court mais moins lisible dans
    # les quelques fermetures « au mieux » du programme.
    "SIM105",
    # Les deux flux rouverts sur la console Windows vivent jusqu'à la fin du
    # programme: un gestionnaire de contexte les fermerait trop tôt.
    "SIM115",
    # `enumerate()` compterait les enregistrements lus; ces compteurs-là
    # comptent les plongées effectivement rendues, ce qui n'est pas pareil.
    "SIM113",
]

[tool.ruff.lint.per-file-ignores]
# Qt impose ses noms en camelCase pour les méthodes redéfinies.
"thermocline/ui/*" = ["N802", "N803", "N806"]
"thermocline/app.py" = ["N803"]
"tests/*" = ["N802"]
