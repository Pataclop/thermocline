name: Release

# Pousser une étiquette `v1.2.3` fabrique les exécutables des trois systèmes
# et les attache à la publication. Le déclenchement manuel sert à refaire une
# version sans créer d'étiquette.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette à publier (ex. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x86_64)
          # Les images macOS récentes tournent sur Apple Silicon; l'image
          # « intel » couvre les Mac d'avant 2020, qui ne peuvent pas exécuter
          # un binaire ARM (Rosetta traduit dans l'autre sens).
          - os: macos-14
            label: macOS (Apple Silicon)
          - os: macos-15-intel
            label: macOS (Intel)
          - os: ubuntu-22.04
            label: Linux (x86_64)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Lancer les tests
        run: python -m unittest discover -s tests -t .

      - name: Compiler
        run: python tools/build.py --clean

      - uses: actions/upload-artifact@v4
        with:
          name: thermocline-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publier la release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Lister ce qui sera publié
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          draft: false
          generate_release_notes: true
          body: |
            ## Installation

            **Windows** — téléchargez le `.zip` `windows-x86_64`, décompressez-le,
            lancez `Thermocline.exe`. Windows affiche un avertissement
            SmartScreen la première fois (l'exécutable n'est pas signé) :
            « Informations complémentaires » → « Exécuter quand même ».

            **macOS** — prenez `macos-arm64` (Mac Apple Silicon, à partir de 2020)
            ou `macos-x86_64` (Mac Intel). Décompressez, glissez
            `Thermocline.app` dans Applications, puis **clic droit → Ouvrir**
            la première fois (l'application n'est pas signée par Apple).

            **Linux** — décompressez et lancez `./Thermocline`. Pour accéder au
            port série : `sudo usermod -aG dialout $USER`, puis rouvrez votre
            session.

            Aucune installation n'est nécessaire, et rien n'est envoyé en ligne.

            ---

            ## Installation (English)

            **Windows** — download the `windows-x86_64` `.zip`, unpack it, run
            `Thermocline.exe`. Windows shows a SmartScreen warning the first
            time (the executable is unsigned): "More info" → "Run anyway".

            **macOS** — take `macos-arm64` (Apple Silicon, 2020 and later) or
            `macos-x86_64` (Intel Macs). Unpack, drag `Thermocline.app` into
            Applications, then **right-click → Open** the first time (the app
            is not notarised by Apple).

            **Linux** — unpack and run `./Thermocline`. For serial port access:
            `sudo usermod -aG dialout $USER`, then log out and back in.

            No installation needed, and nothing is ever sent online.
